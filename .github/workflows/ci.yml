name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: usaspending_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create schemas
        env:
          DATABASE_URL_LOCAL: postgresql://dev:devpassword@localhost:5432/usaspending_dev
        run: |
          python -c "
          from sqlalchemy import create_engine, text
          engine = create_engine('postgresql://dev:devpassword@localhost:5432/usaspending_dev')
          with engine.connect() as conn:
              conn.execute(text('CREATE SCHEMA IF NOT EXISTS raw'))
              conn.execute(text('CREATE SCHEMA IF NOT EXISTS staging'))
              conn.execute(text('CREATE SCHEMA IF NOT EXISTS marts'))
              conn.commit()
          "

      - name: Run pytest
        env:
          DATABASE_URL_LOCAL: postgresql://dev:devpassword@localhost:5432/usaspending_dev
        run: |
          pytest -v